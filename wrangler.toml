# Cloudflare Workers (static assets). Deployed by GitHub Actions on push
# to main, or locally with: npm run build && npx wrangler deploy
name = "someday-app"
account_id = "51cff98c19b84bdb2544f38ecb284fae"
compatibility_date = "2026-07-30"
# Keep the old workers.dev host so existing Home Screen icons still open.
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Apex + www on the same Worker. Zone must already be on this account.
[[routes]]
pattern = "fordays.app"
custom_domain = true

[[routes]]
pattern = "www.fordays.app"
custom_domain = true
