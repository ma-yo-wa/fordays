name: Fordays
options:
  bundleIdPrefix: app.fordays
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fordays:
    type: application
    platform: iOS
    sources:
      - path: Fordays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fordays.ios
        PRODUCT_NAME: Fordays
        INFOPLIST_FILE: Fordays/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Fordays/Fordays.entitlements
        DEVELOPMENT_TEAM: FRATJ8753V
    dependencies:
      - package: Supabase
        product: Supabase
    scheme:
      testTargets: []
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
